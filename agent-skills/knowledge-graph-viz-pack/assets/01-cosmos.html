<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · GPU 星云 — 六万节点实时力导向</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage { cursor: grab; }
  #stage:active { cursor: grabbing; }
  .boot {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: var(--void); transition: opacity 1.2s; font-size: 11px;
    letter-spacing: .4em; color: var(--ink-dim);
  }
  .boot.gone { opacity: 0; pointer-events: none; }
  .boot span { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="scanline"></div>
<div class="boot" id="boot"><span>IGNITING 60,000 STARS ...</span></div>

<div class="hud hud-top">
  <div class="hud-title">
    <div class="kicker">Exhibit 01 · cosmos.gl · Pure GPU Simulation</div>
    <h1>GPU <em>星云</em></h1>
    <div class="sub">整张图的力仿真(斥力/引力/弹簧)与渲染全部跑在 GPU 上 —— 这是 Cosmograph 的核心引擎,笔记本也能实时驱动百万级节点。拖拽平移、滚轮缩放。</div>
  </div>
  <a class="back" href="index.html">◀ 星图馆</a>
</div>

<div class="legend" id="legend"></div>
<div class="readout">
  <div><b id="stat-n">—</b> POINTS · <b id="stat-l">—</b> LINKS · <b>100% GPU</b></div>
  <div class="controls">
    <button class="ctl on" id="btn-run">仿真中 ⏸</button>
    <button class="ctl" id="btn-reheat">重新点燃 ⚡</button>
    <button class="ctl" id="btn-fit">回到全景 ⤢</button>
  </div>
</div>

<script src="data.js"></script>
<script type="module">
import { Graph } from 'https://esm.sh/@cosmos.gl/graph';

const DOMAINS = KG.DOMAINS;
const rand = KG.mulberry32(42);

/* ---------- 程序化生成 6 万点的星云图 ----------
   8 个领域 → 每域 8 个子星团 → 团内优先连接(preferential attachment)
   形成树突状的纤维结构,力导向收敛后像真正的星云 */
const N = 60000, SPACE = 8192;
const SUB_PER_DOMAIN = 8;
const positions = new Float32Array(N * 2);
const colors = new Float32Array(N * 4);
const sizes = new Float32Array(N);
const linkArr = [];

function hex2rgb(h) {
  return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
}
function gauss() { return (rand() + rand() + rand() - 1.5) / 1.5; }

const clusters = [];
DOMAINS.forEach((d, di) => {
  const A = (di / DOMAINS.length) * Math.PI * 2;
  const cx = SPACE / 2 + Math.cos(A) * SPACE * 0.3;
  const cy = SPACE / 2 + Math.sin(A) * SPACE * 0.3;
  for (let s = 0; s < SUB_PER_DOMAIN; s++) {
    const a2 = rand() * Math.PI * 2, r2 = SPACE * (0.05 + rand() * 0.1);
    clusters.push({ domain: di, cx: cx + Math.cos(a2) * r2, cy: cy + Math.sin(a2) * r2, members: [] });
  }
});

for (let i = 0; i < N; i++) {
  const c = clusters[Math.floor(rand() * clusters.length)];
  positions[i * 2]     = c.cx + gauss() * SPACE * 0.045;
  positions[i * 2 + 1] = c.cy + gauss() * SPACE * 0.045;

  const [r, g, b] = hex2rgb(DOMAINS[c.domain].color);
  const glow = 0.75 + rand() * 0.55;                 // 亮度扰动,像恒星色温差
  colors[i * 4] = Math.min(1, r * glow + 0.04);
  colors[i * 4 + 1] = Math.min(1, g * glow + 0.04);
  colors[i * 4 + 2] = Math.min(1, b * glow + 0.04);
  colors[i * 4 + 3] = 0.85;

  sizes[i] = rand() < 0.004 ? 4.5 + rand() * 4 : 0.9 + rand() * 1.4;  // 千分之四是超巨星

  // 团内优先连接:越早加入的点越容易成为枢纽 → 树突纤维
  if (c.members.length > 0) {
    const links = 1 + (rand() < 0.25 ? 1 : 0);
    for (let k = 0; k < links; k++) {
      const j = c.members[Math.floor(Math.pow(rand(), 2.2) * c.members.length)];
      linkArr.push(i, j);
    }
  }
  c.members.push(i);
}
// 稀疏的跨星团"星桥"
for (let k = 0; k < N * 0.006; k++) {
  linkArr.push(Math.floor(rand() * N), Math.floor(rand() * N));
}

/* ---------- 点燃 ---------- */
const graph = new Graph(document.getElementById('stage'), {
  spaceSize: SPACE,
  backgroundColor: '#04060d',
  defaultLinkColor: '#2a3b5e',
  linkOpacity: 0.16,
  linkWidth: 0.4,
  fitViewOnInit: true,
  fitViewPadding: 0.12,
  enableDrag: false,
  simulationFriction: 0.88,
  simulationRepulsion: 1.1,
  simulationRepulsionTheta: 1.5,
  simulationGravity: 0.12,
  simulationCenter: 0.6,
  simulationLinkSpring: 0.6,
  simulationLinkDistance: 4,
  simulationDecay: 6000,
});

graph.setPointPositions(positions);
graph.setPointColors(colors);
graph.setPointSizes(sizes);
graph.setLinks(new Float32Array(linkArr));
graph.render();

document.getElementById('stat-n').textContent = N.toLocaleString();
document.getElementById('stat-l').textContent = (linkArr.length / 2).toLocaleString();

/* ---------- HUD ---------- */
const legend = document.getElementById('legend');
DOMAINS.forEach(d => {
  const el = document.createElement('span');
  el.className = 'chip'; el.style.setProperty('--c', d.color);
  el.innerHTML = `<i></i>${d.name} <span style="opacity:.5">${d.en}</span>`;
  legend.appendChild(el);
});

let running = true;
const btnRun = document.getElementById('btn-run');
btnRun.onclick = () => {
  running = !running;
  running ? graph.unpause() : graph.pause();
  btnRun.textContent = running ? '仿真中 ⏸' : '已冻结 ▶';
  btnRun.classList.toggle('on', running);
};
document.getElementById('btn-reheat').onclick = () => graph.start(1);
document.getElementById('btn-fit').onclick = () => graph.fitView(800);

setTimeout(() => document.getElementById('boot').classList.add('gone'), 900);
// 星云展开后自动重新取景
setTimeout(() => graph.fitView(1200), 4500);
</script>
</body>
</html>
